name: Build Linux ARM64 (ivi-homescreen)

concurrency:
  group: build-linux-arm64
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      flutter-version:
        description: Flutter SDK version
        default: '3.47.7'
        type: string
      build-mode:
        description: Flutter build mode
        required: true
        default: release
        type: choice
        options: [release, profile]
      launcher-args:
        description: Runtime arguments baked into run.sh
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build sigg_launcher (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - board: rpi4
            target: rpi4-trixie
            cpu: cortex-a72
          - board: rpi5
            target: rpi5-trixie
            cpu: cortex-a76

    env:
      FLUTTER_VERSION: ${{ inputs.flutter-version }}
      BUILD_MODE: ${{ inputs.build-mode }}
      LAUNCHER_ARGS: ${{ inputs.launcher-args }}
      BOARD: ${{ matrix.board }}
      TARGET: ${{ matrix.target }}
      CPU: ${{ matrix.cpu }}
      EMB_NON_INTERACTIVE: '1'
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson pkg-config \
            libpugixml-dev libsystemd-dev packagekit libwayland-bin \
            xz-utils rsync unzip fdisk e2fsprogs hwdata

      - name: Clone sources and prepare manifest
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/embedded-build"
          mkdir -p "$B"

          git clone --depth 1 https://github.com/toyota-connected/emb_cli.git "$B/emb_cli"
          git clone --depth 1 --recurse-submodules \
            https://github.com/toyota-connected/ivi-homescreen.git "$B/ivi-homescreen"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/toyota-connected/ivi-homescreen-plugins.git "$B/ivi-homescreen-plugins"

          M="$B/ivi-homescreen/$TARGET.emb.yaml"
          cp "$B/emb_cli/examples/cross/all-backends.emb.yaml" "$M"

          # Add the board target and gamepads plugin.
          python3 - "$M" <<'PY'
          import os
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          content = path.read_text()
          needle = "  backends:\n"
          assert content.count(needle) == 1, "Could not locate exactly one cross.backends section"

          target = os.environ["TARGET"]
          cpu = os.environ["CPU"]

          block = f"""  targets:
            {target}:
              extends: {target}
              cpu_flags: [-mcpu={cpu}]
              defines:
                DISABLE_PLUGINS: 'OFF'
                PLUGINS_DIR: '../ivi-homescreen-plugins/plugins'
                BUILD_PLUGIN_GAMEPADS_LINUX: 'ON'
              sysroot:
                dev_packages:
                  - libsdl3-dev
              backends:
                wayland-egl:
                  BUILD_BACKEND_WAYLAND_EGL: 'ON'
                  BUILD_BACKEND_WAYLAND_VULKAN: 'OFF'
          """
          path.write_text(content.replace(needle, block + needle, 1))
          PY

      - name: Build native Wayland C++ scanner
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/embedded-build/ivi-homescreen/third_party/wayland-cxx-scanner"
          I="$RUNNER_TEMP/wayland-cxx-host"

          cmake -S "$S" -B "$RUNNER_TEMP/wayland-cxx-host-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$I" \
            -DWAYLAND_CXX_SCANNER_TOOL_ONLY=ON \
            -DWAYLAND_CXX_SCANNER_INSTALL_TOOL=ON
          cmake --build "$RUNNER_TEMP/wayland-cxx-host-build" --parallel "$(nproc)"
          cmake --install "$RUNNER_TEMP/wayland-cxx-host-build"

          echo "$I/bin" >> "$GITHUB_PATH"

      - name: Cross-build embedder, plugins and Flutter app
        working-directory: ${{ runner.temp }}/embedded-build/emb_cli
        run: |
          set -euo pipefail
          eval "$(./bootstrap.sh --shellenv)"

          WS="$RUNNER_TEMP/flutter-workspace"
          emb flutter --workspace "$WS" --flutter-version "$FLUTTER_VERSION"
          source "$WS/setup_env.sh"

          emb -v cross "$RUNNER_TEMP/embedded-build/ivi-homescreen/$TARGET.emb.yaml" \
            --workspace "$WS" \
            --target "$TARGET" \
            --backend wayland-egl \
            --app "$GITHUB_WORKSPACE" \
            --mode "$BUILD_MODE" \
            --build

      - name: Package tar.gz and .deb
        run: |
          set -euo pipefail

          HOMESCREEN="$(find "$RUNNER_TEMP/flutter-workspace/.config/flutter_workspace" \
            -type f -path '*/runnable/homescreen' -print -quit)"
          [[ -n "$HOMESCREEN" ]] || { echo "::error::Could not find runnable/homescreen"; exit 1; }
          RUNNABLE_DIR="$(dirname "$HOMESCREEN")"

          cat > "$RUNNABLE_DIR/run.sh" <<EOF
          #!/bin/sh
          HERE="\$(CDPATH= cd -- "\$(dirname -- "\$0")" && pwd)"
          exec "\$HERE/homescreen" -b "\$HERE" $LAUNCHER_ARGS "\$@"
          EOF
          chmod +x "$RUNNABLE_DIR/run.sh"

          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$DIST"

          # ---- tar.gz ----
          tar -C "$RUNNABLE_DIR" -czf "$DIST/sigg_launcher-ivi-linux-arm64-$BOARD.tar.gz" .

          # ---- .deb ----
          VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]+]+).*/\1/p' "$GITHUB_WORKSPACE/pubspec.yaml" | head -n1)"
          VERSION="${VERSION:-0.0.0}-$GITHUB_RUN_NUMBER"
          PKG="sigg-launcher-$BOARD"
          ROOT="$RUNNER_TEMP/deb/$PKG"

          mkdir -p "$ROOT/DEBIAN" "$ROOT/opt/sigg-launcher" "$ROOT/usr/bin"
          cp -a "$RUNNABLE_DIR/." "$ROOT/opt/sigg-launcher/"

          printf '#!/bin/sh\nexec /opt/sigg-launcher/run.sh "$@"\n' > "$ROOT/usr/bin/sigg-launcher"
          chmod 755 "$ROOT/usr/bin/sigg-launcher"

          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: $PKG
          Version: $VERSION
          Architecture: arm64
          Maintainer: sigg_launcher CI <noreply@github.com>
          Section: misc
          Priority: optional
          Installed-Size: $(du -sk "$ROOT/opt" | cut -f1)
          Depends: libc6, libgbm1, libegl1, libgles2, libsystemd0, libsdl3-0, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0
          Provides: sigg-launcher
          Conflicts: sigg-launcher
          Description: sigg_launcher (ivi-homescreen) for Raspberry Pi ${BOARD#rpi}
           Flutter launcher built for $TARGET (-mcpu=$CPU).
          EOF

          find "$ROOT" -type d -exec chmod 755 {} +
          dpkg-deb --root-owner-group --build "$ROOT" "$DIST/${PKG}_${VERSION}_arm64.deb"
          dpkg-deb --info "$DIST/${PKG}_${VERSION}_arm64.deb"

          cd "$DIST"
          sha256sum * > "SHA256SUMS-$BOARD.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: sigg_launcher-ivi-linux-arm64-${{ matrix.board }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
